<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>ShopNext</title>
  </head>
  <body>
    <div id="overlay" class="hidden"></div>
    <div class="wrapper">
      <div class="logo">
        <h1>
          <a href="payment.html">Shop<span>Next</span></a>
        </h1>
        <button class="back-btn return">Back to Address</button>
      </div>
      <div class="container">
        <section class="payment-section">
          <h2>Payment Details</h2>
          <form action="" class="payment-form">
            <div class="form-group">
              <label for="card-number">Card Number*</label>
              <input
                type="text"
                id="card-number"
                placeholder="1234 5678 9012 3456"
                maxlength="19"
                required
              />
              <span class="error-message" id="card-error"></span>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="expiry">Expiry Date*</label>
                <input
                  type="text"
                  id="expiry"
                  placeholder="MM/YY"
                  maxlength="5"
                  required
                />
                <span class="error-message" id="expiry-error"></span>
              </div>
              <div class="form-group">
                <label for="cvv">CVV*</label>
                <input
                  type="text"
                  id="cvv"
                  placeholder="123"
                  maxlength="3"
                  required
                />
                <span class="error-message" id="cvv-error"></span>
              </div>
            </div>
            <div class="form-group">
              <label for="card-name">Cardholder Name*</label>
              <input
                type="text"
                id="card-name"
                placeholder="JOHN DOE"
                required
              />
              <span class="error-message" id="name-error"></span>
            </div>
            <button
              type="submit"
              class="pay-btn"
              disabled
              style="cursor: not-allowed"
            >
              Pay Now
            </button>
          </form>
        </section>
        <aside class="order-summary">
          <h3>Order Summary</h3>
        </aside>
      </div>
    </div>
  </body>
  <script src="payment.js"></script>
</html>
